<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오프라인 — 업무보드</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pretendard Variable", Pretendard, -apple-system,
        BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      background: #f5f5f7;
      color: #48484d;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
    }
    .icon { font-size: 48px; }
    h1 { font-size: 20px; margin: 16px 0 8px; color: #1c1c1e; }
    p { font-size: 14px; color: #7c7c83; margin: 0 0 24px; }
    button {
      background: #0b72d8;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0960b4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>인터넷 연결이 끊어졌습니다</h1>
    <p>업무보드를 사용하려면 네트워크 연결이 필요합니다.<br />연결을 확인한 뒤 다시 시도해주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
